<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKEDEX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="./static/css/pokedexstyle.css" rel="stylesheet">
    <link href="./static/css/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap" rel="stylesheet">


</head>

<body>
  
    <div class="modal fade" id="pokemonModal" tabindex="-1" aria-labelledby="pokemonModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Fechar" style="z-index: 1000;"></button>
                <div class="modal-body p-0" id="pokedexModalBody">
                    
                </div>
            </div>
        </div>
    </div>


    <div class="pokedex-header .flex-row justify-content-center align-items-center">
        <img class="pokeball" src="static/images/pokeballtitle.png" alt="Pokéball">
        <h1>Pokedex</h1>
    </div>

    <button id="btnVoltarTopo" type="button" class="btn shadow rounded-circle">↑</button>

    <div class="container py-4">
       
        <div class="row justify-content-center mb-4">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="search-container position-relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="search-icon">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="searchInput" class="form-control search-input" type="search"
                           placeholder="Search pokémon" aria-label="Search">
                    <ul id="suggestions"></ul>
                </div>
            </div>
        </div>

      
        <div id="pokemonListContainer">
            <div class="row g-3" id="pokemonList">
               
            </div>
        </div>

     
        <div class="text-center my-4">
            <button id="botao" class="btn btn-outline-dark load-more-btn">Load More</button>
        </div>

        <!-- Counter -->
        <p class="counter-text">Número de pokémons: <span id="contador">100</span></p>
    </div>

   
    

    <script src="./static/js/pokemonmodel.js"></script>
    <script src="./static/js/pokeapi.js"></script>
    <script src="./static/js/pokedex.js"></script>
    <script src="./static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>

</html>
